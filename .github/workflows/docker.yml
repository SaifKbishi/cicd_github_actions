name: Docker and Push Docker image to docker hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.NEWCICDWGITHUBACTIONS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          #tags: 19820401/cicd_github_actions:latest
          tags: ${{ secrets.DOCKERUSERNAME }}/cicd_github_actions:latest

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          pytest

  deploy:
    needs:
      - test
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            docker pull 19820401/cicd_github_actions:latest

            docker rm -f cicd_github_actions || true

            docker run -d \
              --name cicd_github_actions \
              -p 5000:5000 \
              --restart unless-stopped \
              19820401/cicd_github_actions:latest
      - name: Check GitHub Runner SSH Access
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Checking SSH connectivity..."

          if timeout 10 bash -c 'echo > /dev/tcp/"$1"/22' _ "$SERVER_HOST"; then
            echo "SUCCESS: EC2 port 22 is reachable"
          else
            echo "FAILED: EC2 port 22 is unreachable"
            exit 1
          fi
          
  healthcheck:
    needs: deploy

    runs-on: ubuntu-latest

    steps:
      - name: Verify Application
        run: |
          sleep 10

          curl http://${{ secrets.SERVER_HOST }}:5000/canada